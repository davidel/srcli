[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "srcli"
version = "0.1.0"
description = "Command line super-resolution upscaling tool"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pillow",
  "torch",
  "huggingface_hub",
  "einops",
]

[project.optional-dependencies]
dev = ["pytest", "yapf", "ruff"]
# gdown pulls the HAT checkpoints from the official Google Drive folder. It is
# optional because the other models never need it.
gdrive = ["gdown"]

[project.scripts]
sr = "srcli.cli:main"

[tool.setuptools.packages.find]
include = ["srcli*"]
